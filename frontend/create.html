<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="/manifest.json" />
  <title>WasteWise AI — Give Your Waste a Second Life</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="create">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">♻️</span> WasteWise <span style="font-weight:600; color:var(--ink-soft)">AI</span></a>
    <div class="desktop-nav"></div>
    <div class="topbar-right">
      <span class="user-chip" id="userChip" style="display:none"></span>
      <a class="icon-btn" id="logoutBtn" href="#" style="display:none">Logout</a>
    </div>
  </header>

  <main class="main">
    <div class="hero">
      <span class="emoji">💡</span>
      <h1>Give Your Waste a Second Life.</h1>
      <p class="tagline" id="ideaSubtitle">Personalised reuse ideas, just for your waste.</p>
    </div>

    <div class="spinner-wrap" id="loading">
      <div class="spinner"></div>
      <p>✨ Generating smart ideas…</p>
    </div>

    <div id="ideasList"></div>

    <div id="noIdeas" class="card empty" style="display:none">
      <p>🤖 We couldn't come up with safe ideas for this item.</p>
      <p class="time-stamp">Try the recycle or dispose options instead.</p>
    </div>

    <div id="errorBox" class="alert alert-danger" style="display:none; text-align:center">
      <p id="errorMsg"></p>
      <a class="btn btn-primary" href="result.html">Back to result</a>
    </div>

    <footer>♻️ WasteWise AI — give your waste a second life</footer>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/demo.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/sw-register.js"></script>
  <script src="/js/create.js"></script>
</body>
</html>
